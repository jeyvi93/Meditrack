<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultation Log | MediTrack</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <!-- Icons -->
     <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/consultation.css">
    <link rel="stylesheet" href="../assets/css/sidebar.css">
</head>
<body>

    <div id="sidebar"></div>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <div class="bg-gradient"></div>

            <header class="content-header">
                <div class="title-area">
                    <h1>New Consultation Log</h1>
                    <p>Record patient complaints, treatments, and medicines dispensed.</p>
                </div>
                <a href="view_consultation.html" class="btn-secondary">
                    <i class="fas fa-list"></i> View All Logs
                </a>
            </header>

            <form id="consultationForm">

                <div class="input-grid two-cols">
                    <div class="input-group">
                        <label>Date</label>
                        <input type="date" required>
                    </div>
                    <div class="input-group">
                        <label>Time</label>
                        <input type="time" required>
                    </div>
                </div>
                
                <!-- SECTION 1: PATIENT INFORMATION -->
                <section class="form-card">
                    <div class="card-header">
                        <i class="fas fa-user-circle"></i>
                        <h2>Patient Information</h2>
                    </div>

                    <div class="input-grid two-cols">
                        <div class="input-group">
                            <label>Patient Type</label>
                            <select id="patientType" onchange="togglePatientFields()" required>
                                <option value="student">Student</option>
                                <option value="tstaff">Teaching Staff</option>
                                <option value="nstaff">Non-Teaching Staff</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Full Name</label>
                            <input type="text" placeholder="Enter Full Name" required>
                        </div>
                    </div>

                    <div class="input-grid three-cols">
                        <div class="input-group">
                            <label>Age</label>
                            <input type="number" placeholder="0">
                        </div>
                        <div class="input-group">
                            <label>Sex</label>
                            <select>
                                <option>Male</option>
                                <option>Female</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Contact Number</label>
                            <input type="tel" placeholder="09XX XXX XXXX">
                        </div>
                    </div>

                    <div class="input-grid" id="sharedDepartmentField">
                        <div class="input-group">
                            <label>Department</label>
                            <input type="text" placeholder="e.g. School of Technology">
                        </div>
                    </div>

                    <!-- CONDITIONAL: STUDENT FIELDS -->
                    <div class="input-grid two-cols conditional-fields" id="studentFields">
                        <div class="input-group">
                            <label>Course</label>
                            <input type="text" placeholder="e.g. BS Information Technology">
                        </div>
                        <div class="input-group">
                            <label>Year Level</label>
                            <select>
                                <option>1st Year</option>
                                <option>2nd Year</option>
                                <option>3rd Year</option>
                                <option>4th Year</option>
                            </select>
                        </div>
                    </div>

                    <!-- CONDITIONAL: STAFF FIELDS -->
                    <div class="input-grid conditional-fields" id="staffFields" style="display:none;">
                        <div class="input-group">
                            <label>Position</label>
                            <input type="text" placeholder="e.g. Instructor I / Admin Assistant">
                        </div>
                    </div>
                </section>

                <!-- SECTION 2: CLINICAL ASSESSMENT -->
                <section class="form-card">
                    <div class="card-header">
                        <i class="fas fa-stethoscope"></i>
                        <h2>Clinical Assessment</h2>
                    </div>
                    <div class="input-group">
                        <label>Complaint / Symptoms</label>
                        <textarea rows="2" placeholder="What is the patient feeling?"></textarea>
                    </div>
                    <div class="input-row two-cols">
                        <div class="input-group">
                            <label>Treatment Given</label>
                            <textarea rows="3" placeholder="Procedures or first aid performed"></textarea>
                        </div>
                        <div class="input-group">
                            <label>Remarks</label>
                            <textarea rows="3" placeholder="Observation or recommendations"></textarea>
                        </div>
                    </div>
                </section>

                <!-- SECTION 3: MEDICINES DISPENSED -->
                <section class="form-card">
                    <div class="card-header space-between">
                        <div class="header-title">
                            <i class="fas fa-pills"></i>
                            <h2>Medicines Dispensed</h2>
                        </div>
                        <button type="button" class="btn-add-row" onclick="addMedicineRow()">
                         Add Medicine
                        </button>
                    </div>

                    <div id="medicineRows">
                        <!-- Medicine Row 1 (Default) -->
                        <div class="medicine-row">
                            <div class="input-group">
                                <label>Medicine Name</label>
                                <select class="med-select">
                                    <option value="">Select Medicine from Inventory</option>
                                    <option>Paracetamol 500mg</option>
                                    <option>Amoxicillin 250mg</option>
                                    <option>Cetirizine 10mg</option>
                                </select>
                            </div>
                            <div class="input-group qty-input">
                                <label>Quantity</label>
                                <input type="number" min="1" value="1">
                            </div>
                            <div class="row-action">
                                <!-- No delete on first row -->
                            </div>
                        </div>
                    </div>
                </section>

                <div class="form-actions">
                    <button type="reset" class="btn-ghost">Clear All</button>
                    <button type="submit" class="btn-primary">Save Consultation Log</button>
                </div>
            </form>
        </main>

    <script src="../assets/js/consultation.js"></script>
    <script src="../includes/includes.js"></script>
</body>
</html>
